{% extends "layouts/auth.html" %}

{% block title %}Check your email — Greenhand{% endblock %}

{% block form_column %}
  <h1 class="font-display text-[34px] font-semibold leading-tight tracking-tight sm:text-[40px]">Check your email</h1>
  <p class="mt-2 text-[15px] text-muted">If an account exists for that address, we&rsquo;ve sent a link to reset your password. It can take a few minutes to arrive.</p>
  <a href="{% url 'userprofile:login' %}" class="mt-8 flex h-11 w-full items-center justify-center rounded-lg bg-ink text-[15px] font-medium text-white shadow-sm transition hover:bg-forest-900">Back to sign in</a>
{% endblock %}
