{% extends "layouts/auth.html" %}

{% block title %}Password updated — Greenhand{% endblock %}

{% block form_column %}
  <h1 class="font-display text-[34px] font-semibold leading-tight tracking-tight sm:text-[40px]">Password updated</h1>
  <p class="mt-2 text-[15px] text-muted">Your password has been changed. You can sign in with it now.</p>
  <a href="{% url 'userprofile:login' %}" class="mt-8 flex h-11 w-full items-center justify-center rounded-lg bg-ink text-[15px] font-medium text-white shadow-sm transition hover:bg-forest-900">Sign in</a>
{% endblock %}
