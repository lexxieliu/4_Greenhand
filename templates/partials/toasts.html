{# Toast stack. Django messages render here on page load; page scripts add more with GH.toast(). #}
<div id="toasts" class="pointer-events-none fixed inset-x-0 bottom-20 z-[70] flex flex-col items-center gap-2 px-4 lg:bottom-6" aria-live="polite">
  {% for message in messages %}
    <div class="toast pointer-events-auto flex items-center gap-3 rounded-xl bg-ink py-2.5 pl-3.5 pr-3.5 text-[14px] text-white shadow-float" data-autodismiss>
      <svg class="ic h-4 w-4 {% if message.level_tag == 'error' %}text-rose-300{% else %}text-lime-300{% endif %}"><use href="#{% if message.level_tag == 'error' %}i-alert-circle{% else %}i-check{% endif %}"/></svg>
      <span>{{ message }}</span>
    </div>
  {% endfor %}
</div>
