{% extends 'base.html' %}

{% block title %}Plant Detail{% endblock %}

{% block content %}
  <h2>Plant Details for {{ single_plant.plant_name }}</h2>

  <div class="profile-card">
    <p><strong>Category:</strong> {{ single_plant.category }}</p>
    <p><strong>Scientific Name:</strong> {{ single_plant.scientific_name }}</p>
    <p><strong>Usage Type:</strong> {{ single_plant.usage_type }}</p>
  </div>

  <hr>

{% endblock %}
