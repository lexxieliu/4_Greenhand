{% extends 'base.html' %}

{% block title %}Plant List{% endblock %}

{% block content %}
  <h2>List of Plants</h2>
  <ul>
    {% for plant in plants_list %}
        <li><a href="{{ plant.get_absolute_url }}"> {{ plant.plant_name }} </a></li>
    {% empty %}
      <li>No plants available.</li>
    {% endfor %}
  </ul>
{% endblock %}
