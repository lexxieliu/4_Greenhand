{% extends 'base.html' %}

{% block title %}User Profiles{% endblock %}

{% block content %}
  <h2>User Profiles List</h2>
  <ul>
    {% for profile in profiles %}
      <li>
        <strong><a href="{% url 'profile-cbv-generic-detail' profile.pk %}">{{ profile.user.username }}</a></strong>
      </li>
    {% empty %}
      <li>No profiles available.</li>
    {% endfor %}
  </ul>
{% endblock %}
