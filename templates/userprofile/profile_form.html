{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
  <h2>Edit Profile for {{ object.user.username }}</h2>


  <form method="post">
    {% csrf_token %}
    

    {{ form.as_p }}

    <button type="submit">Save Changes</button>
    <a href="{% url 'profile-cbv-generic-detail' object.pk %}">Cancel</a>
  </form>
{% endblock %}
