{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Greenhand{% endblock %}</title>
  <meta name="description" content="{% block description %}Greenhand is a personal AI tutor for urban and backyard farming.{% endblock %}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  {% include "partials/tailwind.html" %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}bg-white font-sans text-ink{% endblock %}" data-today="{{ gh_today|date:'Y-m-d' }}">
  {% include "partials/icons.html" %}
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-ink focus:px-4 focus:py-2 focus:text-white">Skip to content</a>

  {% block body %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
